version: 1.3.12

# エンドポイント設定
endpoints:
  openai:
    enabled: true
    type: openai
    apiKey: ${OPENAI_API_KEY}
    baseURL: https://api.openai.com/v1
    models:
      default: ["gpt-4", "gpt-3.5-turbo"]
  
  orca:
    enabled: true
    type: openai
    apiKey: ${ORCA_API_KEY}
    baseURL: https://api.orcarouter.ai/v1
    models:
      default: ["fable"]
  
  azure:
    enabled: false
  
  bingAI:
    enabled: false
  
  google:
    enabled: false
  
  anthropic:
    enabled: false

# プラグイン設定
plugins:
  enabled: true

# ユーザー登録設定
registration:
  enabled: true
  requireEmail: false        # メール認証を不要にする（任意）
  allowMultipleAccounts: true # 複数アカウント作成を許可

# ファイル設定
fileConfig:
  endpoints:
    - openai
    - assistants
  serverFileSizeLimit: 25
  avatarSizeLimit: 2

# モデル仕様
modelSpecs:
  - name: gpt-4
    label: GPT-4
    default: false
    costFactor: 30
    deploymentName: gpt-4
  
  - name: gpt-3.5-turbo
    label: GPT-3.5 Turbo
    default: true
    costFactor: 1
    deploymentName: gpt-3.5-turbo
  
  - name: gpt-4-turbo
    label: GPT-4 Turbo
    default: false
    costFactor: 10
    deploymentName: gpt-4-turbo

# キャッシュ設定
cache:
  enabled: false

# ロギング設定
logging:
  level: info

# セッション設定
session:
  expiresIn: 1h

# レート制限
rateLimit:
  enabled: true
  windowMs: 15
  maxRequests: 100
