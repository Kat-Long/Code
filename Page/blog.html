<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #001F3F; --accent: #FF6633; --light-bg: #eee9e5; --text-dark: #333; --text-light: #666; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: var(--text-dark); }
        header { background: var(--light-bg); color: var(--primary); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: bold; text-decoration: none; color: var(--primary); }
        .logo-image { height: 50px; width: auto; }
        nav { display: flex; gap: 2rem; align-items: center; }
        nav a { color: var(--primary); text-decoration: none; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }
        .lang-switch { background: var(--accent); color: var(--white); border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
        .blog-hero { background: linear-gradient(135deg, var(--primary) 0%, #003d5c 100%); color: var(--white); padding: 4rem 1rem; text-align: center; }
        .blog-hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .blog-container { max-width: 1200px; margin: 0 auto; padding: 3rem 1rem; }
        .category-section { margin-bottom: 4rem; }
        .category-title { font-size: 1.8rem; color: var(--primary); margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 3px solid var(--accent); }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .blog-card { background: var(--white); border-radius: 10px; overflow: hidden; border-top: 4px solid var(--accent); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .blog-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .blog-card-image { width: 100%; height: 200px; object-fit: cover; display: block; }
        .blog-card-header { background: linear-gradient(135deg, var(--primary) 0%, #003d5c 100%); color: var(--white); padding: 1.5rem; }
        .blog-card-header h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .blog-date { font-size: 0.85rem; opacity: 0.8; }
        .blog-card-body { padding: 1.5rem; }
        .blog-catchcopy { color: var(--accent); font-weight: 600; font-size: 0.95rem; margin-bottom: 1rem; }
        .blog-excerpt { color: var(--text-light); margin-bottom: 1rem; }
        .blog-read-more { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
        .blog-detail { display: none; padding: 2rem; background: var(--light-bg); border-radius: 10px; margin-top: 1rem; }
        .blog-detail.active { display: block; }
        .blog-detail h4 { color: var(--primary); margin-bottom: 1rem; }
        .blog-detail p { margin-bottom: 1rem; line-height: 1.8; }
        .close-detail { background: var(--primary); color: var(--white); border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
        footer { background: #000; color: var(--white); padding: 2rem 1rem; text-align: center; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-bottom: 2rem; }
        .footer-section h4 { color: var(--accent); margin-bottom: 1rem; }
        .footer-section a { color: var(--white); text-decoration: none; display: block; margin-bottom: 0.5rem; }
        @media (max-width: 768px) { .blog-hero h1 { font-size: 1.8rem; } nav { display: none; } .blog-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WQJCCTCV"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo"><img src="logo.png" alt="EVEN A&C" class="logo-image"><span style="margin-left: 0.5rem; font-size: 1.2rem;">EVEN A&C</span></a>
            <nav id="nav-menu">
                <a href="index.html#services" data-ja="サービス" data-zh="服務">サービス</a>
                <a href="blog.html" data-ja="ブログ" data-zh="部落格">ブログ</a>
                <a href="index.html#contact" data-ja="お問い合わせ" data-zh="聯絡我們">お問い合わせ</a>
                <button class="lang-switch" onclick="toggleLanguage()" data-ja="華語" data-zh="繁體中文">華語</button>
            </nav>
        </div>
    </header>

    <section class="blog-hero">
        <h1 data-ja="ブログ" data-zh="部落格">ブログ</h1>
        <p data-ja="EVEN A&Cの最新情報とお役立ち情報" data-zh="EVEN A&C的最新信息和有用信息">EVEN A&Cの最新情報とお役立ち情報</p>
    </section>

    <div class="blog-container" id="blog-content">
        <!-- ブログ記事は JavaScript で動的に生成されます -->
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4 data-ja="サービス" data-zh="服務">サービス</h4>
                <a href="index.html#services">税務申告サポート</a>
                <a href="index.html#services">出国停止解除</a>
                <a href="index.html#services">会計代行</a>
            </div>
            <div class="footer-section">
                <h4 data-ja="情報" data-zh="信息">情報</h4>
                <a href="blog.html">ブログ</a>
                <a href="index.html#threads">Threads</a>
                <a href="index.html#contact">お問い合わせ</a>
            </div>
            <div class="footer-section">
                <h4 data-ja="会社情報" data-zh="公司信息">会社情報</h4>
                <a href="index.html#company-info">住所</a>
                <a href="index.html#company-info">営業時間</a>
                <a href="index.html#company-info">連絡先</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 EVEN A&C. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let currentLanguage = 'ja';
        let articlesData = [];

        // 記事データを読み込む
        async function loadArticles() {
            try {
                const response = await fetch('articles.json');
                articlesData = await response.json();
                renderBlog();
            } catch (error) {
                console.error('Error loading articles:', error);
            }
        }

        // ブログを動的に生成
        function renderBlog() {
            const blogContent = document.getElementById('blog-content');
            blogContent.innerHTML = '';

            // 記事を日付の新しい順でソート
            const sortedArticles = [...articlesData.articles].sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });

            // カテゴリーごとにグループ化
            const categories = {};
            sortedArticles.forEach(article => {
                const categoryKey = currentLanguage === 'ja' ? article.category_ja : article.category_zh;
                if (!categories[categoryKey]) {
                    categories[categoryKey] = [];
                }
                categories[categoryKey].push(article);
            });

            // カテゴリーごとにセクションを作成
            Object.keys(categories).forEach(category => {
                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = category;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'blog-grid';

                categories[category].forEach(article => {
                    const card = createBlogCard(article);
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                blogContent.appendChild(section);
            });
        }

        // ブログカードを作成
        function createBlogCard(article) {
            const card = document.createElement('div');
            card.className = 'blog-card';
            card.dataset.articleId = article.id;

            const titleKey = currentLanguage === 'ja' ? 'title_ja' : 'title_zh';
            const catchcopyKey = currentLanguage === 'ja' ? 'catchcopy_ja' : 'catchcopy_zh';
            const excerptKey = currentLanguage === 'ja' ? 'excerpt_ja' : 'excerpt_zh';
            const contentKey = currentLanguage === 'ja' ? 'content_ja' : 'content_zh';

            const html = `
                <img src="${article.image}" alt="${article[titleKey]}" class="blog-card-image">
                <div class="blog-card-header">
                    <h3>${article[titleKey]}</h3>
                    <div class="blog-date">${article.date}</div>
                </div>
                <div class="blog-card-body">
                    <div class="blog-catchcopy">${article[catchcopyKey]}</div>
                    <p class="blog-excerpt">${article[excerptKey]}</p>
                    <a href="#" class="blog-read-more" onclick="toggleDetail(event)">${currentLanguage === 'ja' ? '続きを読む →' : '繼續閱讀 →'}</a>
                </div>
                <div class="blog-detail">
                    <h4>${currentLanguage === 'ja' ? '詳細' : '詳細'}</h4>
                    <p>${article[contentKey]}</p>
                    <button class="close-detail" onclick="closeDetail(event)">${currentLanguage === 'ja' ? '閉じる' : '關閉'}</button>
                </div>
            `;

            card.innerHTML = html;
            // クリックイベント：カード全体をクリック可能に
            card.addEventListener('click', function(ev) {
                // クリックが内部のリンク/閉じるボタンから発生している場合は何もしない
                if (ev.target.closest('.blog-read-more') || ev.target.closest('.close-detail')) return;
                const articleId = parseInt(card.dataset.articleId, 10);
                const ar = articlesData.articles.find(a => a.id === articleId);
                const link = ar && ar[`external_link_${currentLanguage}`];
                if (link) {
                    window.open(link, '_blank');
                } else {
                    const detail = card.querySelector('.blog-detail');
                    if (detail) detail.classList.add('active');
                }
            });
            return card;
        }

        // 詳細を表示/非表示
        function toggleDetail(event) {
            event.preventDefault();
            const card = event.target.closest('.blog-card');
            const articleId = parseInt(card.dataset.articleId);
            const article = articlesData.articles.find(a => a.id === articleId);

            // external_link がある場合は外部ファイルへ移動
            if (article && article[`external_link_${currentLanguage}`]) {
                window.open(article[`external_link_${currentLanguage}`], '_blank');
                return;
            }

            // external_link がない場合はカード内展開
            const detail = card.querySelector('.blog-detail');
            detail.classList.add('active');
        }

        function closeDetail(event) {
            event.preventDefault();
            const card = event.target.closest('.blog-card');
            const detail = card.querySelector('.blog-detail');
            detail.classList.remove('active');
        }

        // 言語切り替え
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'ja' ? 'zh' : 'ja';
            updateLanguage();
            updateButtonText();
            renderBlog();
        }

        function updateLanguage() {
            const elements = document.querySelectorAll('[data-ja][data-zh]');
            elements.forEach(el => {
                const text = el.getAttribute(`data-${currentLanguage}`);
                if (text) el.textContent = text;
            });
        }

        function updateButtonText() {
            const btn = document.querySelector('.lang-switch');
            btn.textContent = currentLanguage === 'ja' ? '華語' : '日本語';
        }

        // ページ読み込み時に記事を読み込む
        window.addEventListener('DOMContentLoaded', loadArticles);
    </script>

</body>
</html>
